dotfiles:
  - { source: "gitconfig.base", dest: ".gitconfig.base" }
  - { source: "gitignore_global", dest: ".gitignore_global" }
  - { source: "zshrc", dest: ".zshrc" }
  - { source: "tmux.conf", dest: ".tmux.conf" }
  - { source: "vimrc", dest: ".vimrc" }
  - { source: "nvim", dest: ".config/nvim" }
  - { source: "ghostty/config", dest: ".config/ghostty/config" }
  - { source: "AGENT.md", dest: ".claude/CLAUDE.md" }

# ~/.claude/settings.json is generated (not symlinked) so it can merge in an
# optional machine-local override file. See the "Generate merged Claude Code
# settings" task in tasks/dotfiles.yml.
claude_local_settings_path: "{{ ansible_facts['user_dir'] }}/repos/dotfiles-local/claude/settings.local.json"

optional_dotfiles:
  - { source: "editorconfig", dest: ".editorconfig", description: "global editorconfig file" }

macos_services_to_restart:
  - Dock
  - Finder
  - WindowManager
  - SystemUIServer
  - Spotlight

homebrew_formulae:
  - cmake
  - container
  - fd
  - fzf
  - jdtls
  - neovim
  - ripgrep
  - tmux
  - wget

homebrew_casks:
  - anki
  - ghostty

# Linux: CLI tools via linuxbrew (/home/linuxbrew/.linuxbrew, survives SteamOS
# updates), GUI apps via Flatpak. These lists are intentionally independent of
# the macOS lists above.
linuxbrew_formulae:
  - cmake
  - fd
  - fzf
  - gh
  - neovim
  - ripgrep
  - tmux
  - wget
  - zsh

# Flathub app IDs. Installed on SteamOS only, and only with install_optional=true.
flatpak_apps:
  - net.ankiweb.Anki
  - com.mitchellh.ghostty
  - io.gitlab.librewolf-community
  - io.mpv.Mpv

# EmuDeck has no unattended mode. The playbook only downloads the AppImage to
# ~/Applications and launches its GUI wizard once, in Desktop Mode. Opt in with
# -e install_emudeck=true.
# SteamOS only: write libinput settings (tap-to-click, natural scroll) for a
# USB Apple Magic Trackpad to ~/.config/kcminputrc. See tasks/trackpad.yml.
configure_magic_trackpad: true

# SteamOS only: verify DDC/CI monitor control works (ddcutil and its i2c-dev
# support ship with SteamOS 3.7+; the playbook installs nothing). See
# tasks/ddcci.yml.
configure_ddcci: true

install_emudeck: false

optional_homebrew_formulae:
  - gh
  - node

optional_homebrew_casks:
  - blackhole-2ch
  - claude-code
  - crossover
  - dolphin
  - iina
  - ilok-license-manager
  - retroarch-metal
  - steam
  - stremio
  - valhalla-supermassive
  - vlc

terminal_profiles: ["Basic", "Pro", "Clear Dark"]
terminal_settings:
  - { key: "shellExitAction", type: "integer", value: "1" }
  - { key: "BackgroundAlphaInactive", type: "real", value: "0.5" }
  - { key: "BackgroundSettingsForInactiveWindows", type: "bool", value: "true" }

managed_login_items:
  - { type: "TeamIdentifier", value: "MXGJJ98X76", comment: "Steam", disposition: "Disallowed" }

manage_login_items: false
install_packages: true
configure_system_audio: true
configure_night_shift: true
