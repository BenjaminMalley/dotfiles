# DDC/CI monitor control smoke test for SteamOS Desktop Mode. No setup is
# needed on SteamOS 3.7+: ddcutil is a hard dependency of powerdevil in the
# SteamOS repos, and its package ships /usr/lib/modules-load.d/ddcutil.conf
# (loads i2c-dev at boot) and a udev uaccess rule for /dev/i2c-*. The Plasma 6
# brightness applet then controls external monitors out of the box. This file
# only verifies that chain works; it installs nothing.

- name: Check whether the kernel exposes I2C device nodes
  ansible.builtin.stat:
    path: /dev/i2c-0
  register: i2c_dev

- name: Warn when the kernel exposes no I2C device nodes
  ansible.builtin.debug:
    msg:
      - "No /dev/i2c-* nodes: i2c-dev is not loaded, so DDC/CI monitor control is unavailable."
      - "SteamOS 3.7+ loads it at boot via /usr/lib/modules-load.d/ddcutil.conf; on older images there is no userspace fix (ValveSoftware/SteamOS#1004)."
  when: not i2c_dev.stat.exists

- name: Detect monitors over DDC/CI
  ansible.builtin.command: ddcutil detect
  register: ddcutil_detect
  changed_when: false
  failed_when: false
  when: i2c_dev.stat.exists

- name: Report detected monitors
  ansible.builtin.debug:
    msg: "{{ ddcutil_detect.stdout_lines | default([]) | select('match', '^(Display|  )') | list or 'ddcutil found no DDC/CI-capable monitor' }}"
  when: i2c_dev.stat.exists
