- name: Create dotfile directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ (['.claude/rules'] + ((dotfiles + local_dotfiles) | map(attribute='dest') | map('dirname') | list)) | select | unique }}"

- name: Generate merged ~/.claude/settings.json
  ansible.builtin.copy:
    content: >-
      {{
        (lookup('file', core_repo + '/claude-settings.json') | from_json)
        | combine(
            (lookup('file', local_repo + '/claude-settings.json') | from_json) if local_repo is defined and (local_repo + '/claude-settings.json') is file else {},
            recursive=true,
            list_merge='append_rp'
          )
        | to_nice_json
      }}
    dest: "{{ ansible_facts['user_dir'] }}/.claude/settings.json"
    mode: "0644"

- name: Ensure ~/.gitconfig includes gitconfig.base
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    block: |
      [include]
          path = ~/.gitconfig.base
    create: true
    mode: "0644"

- name: Symlink core dotfiles
  ansible.builtin.file:
    src: "{{ core_repo }}/{{ item.source }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles }}"

- name: Symlink local dotfiles
  ansible.builtin.file:
    src: "{{ local_repo }}/{{ item.source }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ local_dotfiles }}"

- name: Symlink core agent instructions
  ansible.builtin.file:
    src: "{{ core_repo }}/agent-instructions.md"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/rules/core.md"
    state: link
    force: true

- name: Symlink local agent instructions
  ansible.builtin.file:
    src: "{{ local_repo }}/agent-instructions.md"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/CLAUDE.md"
    state: link
    force: true
  when: local_repo is defined and (local_repo + '/agent-instructions.md') is file
