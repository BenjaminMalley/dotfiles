- name: Create dotfile directories
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .config/ghostty
    - .config/nvim
    - .claude/agents
    - .claude/skills

- name: Check for machine-local Claude Code settings overrides
  ansible.builtin.stat:
    path: "{{ claude_local_settings_path }}"
  register: claude_local_settings_stat

- name: Generate merged ~/.claude/settings.json
  ansible.builtin.copy:
    content: >-
      {{
        (lookup('file', playbook_dir + '/../claude-settings.json') | from_json)
        | combine(
            (lookup('file', claude_local_settings_path) | from_json) if claude_local_settings_stat.stat.exists else {},
            recursive=true,
            list_merge='append_rp'
          )
        | to_nice_json
      }}
    dest: "{{ ansible_facts['user_dir'] }}/.claude/settings.json"
    mode: "0644"

- name: Ensure ~/.gitconfig includes gitconfig.base
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    block: |
      [include]
          path = ~/.gitconfig.base
    create: true
    mode: "0644"

- name: Symlink standard dotfiles
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../{{ item.source }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ dotfiles }}"

- name: Symlink optional dotfiles
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../{{ item.source }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.dest }}"
    state: link
    force: true
  loop: "{{ optional_dotfiles }}"
  when: install_optional | default(false) | bool

- name: Symlink agent files
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/agents/{{ item | basename }}"
    state: link
    force: true
  with_fileglob:
    - "{{ playbook_dir }}/../agents/*"

- name: Symlink skill directories
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/skills/{{ item | basename }}"
    state: link
    force: true
  with_fileglob:
    - "{{ playbook_dir }}/../skills/*"
  when: item is directory

- name: Symlink scripts directory
  ansible.builtin.file:
    src: "{{ playbook_dir }}/../scripts"
    dest: "{{ ansible_facts['user_dir'] }}/.claude/scripts"
    state: link
    force: true
