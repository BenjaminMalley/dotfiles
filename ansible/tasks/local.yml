- name: Locate the core and local repos
  ansible.builtin.set_fact:
    core_repo: "{{ (playbook_dir + '/..') | realpath }}"
    local_repo: "{{ (playbook_dir + '/../..') | realpath }}"

- name: Check that the local repo holds this repo as a submodule
  ansible.builtin.stat:
    path: "{{ local_repo }}/.gitmodules"
  register: local_gitmodules

- name: Require a local repo
  ansible.builtin.assert:
    that: local_gitmodules.stat.exists
    fail_msg: "Run bootstrap.sh from a local repo that holds this repo as a submodule at ./dotfiles. {{ local_repo }} has no .gitmodules."
    quiet: true

- name: Check for local.yml
  ansible.builtin.stat:
    path: "{{ local_repo }}/local.yml"
  register: local_vars_file

- name: Load local.yml
  ansible.builtin.include_vars:
    file: "{{ local_repo }}/local.yml"
    name: local_vars
  when: local_vars_file.stat.exists

- name: Append local supplements to core lists
  ansible.builtin.set_fact:
    brew_formulae: "{{ homebrew_formulae + (local_vars | default({})).homebrew_formulae | default([]) }}"
    brew_casks: "{{ homebrew_casks + (local_vars | default({})).homebrew_casks | default([]) }}"
    local_dotfiles: "{{ (local_vars | default({})).dotfiles | default([]) }}"
