# Package provisioning.
# macOS: Homebrew in /opt/homebrew.

- name: Set OS-specific package facts
  ansible.builtin.set_fact:
    brew_bin: "/opt/homebrew/bin/brew"
    brew_formulae: "{{ homebrew_formulae }}"

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: homebrew_check
  when: install_packages | default(true) | bool

# install.sh prints a "Next steps" message telling you to add the brew
# shellenv eval to .bashrc. Ignore that: this repo does not manage .bashrc,
# and zshrc already has the eval for the .zshrc it symlinks in.
- name: Install Homebrew
  ansible.builtin.shell: |
    NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: (install_packages | default(true) | bool) and not homebrew_check.stat.exists
  changed_when: true

# The install task above is skipped in check mode, so re-stat: the brew module
# tasks below must not run when brew is absent (keeps CI's dry run green).
- name: Re-check Homebrew installation
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: homebrew_installed
  when: install_packages | default(true) | bool

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  register: brew_update
  failed_when: brew_update is failed and 'Could not update' not in brew_update.msg and 'Fetching' not in brew_update.msg
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ brew_formulae }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_formulae
  until: brew_install_formulae is succeeded
  retries: 3
  delay: 5
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Upgrade Homebrew formulae
  ansible.builtin.command: "{{ brew_bin }} upgrade --formula {{ brew_formulae | join(' ') }}"
  register: brew_upgrade_formulae
  changed_when: "'Already up-to-date' not in brew_upgrade_formulae.stdout"
  failed_when: false
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_casks
  until: brew_install_casks is succeeded
  retries: 3
  delay: 5
  when:
    - install_packages | default(true) | bool
    - homebrew_installed.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: Install optional Homebrew formulae
  community.general.homebrew:
    name: "{{ optional_homebrew_formulae }}"
    state: present
    upgrade: true
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_optional_formulae
  until: brew_install_optional_formulae is succeeded
  retries: 3
  delay: 5
  when:
    - install_packages | default(true) | bool
    - install_optional | default(false) | bool
    - homebrew_installed.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: Install optional Homebrew casks
  community.general.homebrew_cask:
    name: "{{ optional_homebrew_casks }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_optional_casks
  until: brew_install_optional_casks is succeeded
  retries: 3
  delay: 5
  when:
    - install_packages | default(true) | bool
    - install_optional | default(false) | bool
    - homebrew_installed.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: Remove unused Homebrew dependencies (autoremove)
  ansible.builtin.command: "{{ brew_bin }} autoremove"
  register: brew_autoremove
  changed_when: brew_autoremove.stdout != ""
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists
