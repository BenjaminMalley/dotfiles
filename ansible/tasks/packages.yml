# Package provisioning.
# macOS: Homebrew in /opt/homebrew. Linux: linuxbrew in
# /home/linuxbrew/.linuxbrew (lives in /home, so it survives SteamOS updates)
# for CLI tools, plus Flatpak for GUI apps.

- name: Set OS-specific package facts
  ansible.builtin.set_fact:
    brew_bin: "{{ '/opt/homebrew/bin/brew' if ansible_facts['os_family'] == 'Darwin' else '/home/linuxbrew/.linuxbrew/bin/brew' }}"
    brew_formulae: "{{ homebrew_formulae if ansible_facts['os_family'] == 'Darwin' else linuxbrew_formulae }}"

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: homebrew_check
  when: install_packages | default(true) | bool

# On Linux, install.sh creates /home/linuxbrew itself via sudo, which needs
# an interactive password prompt; running the whole install as root instead
# makes install.sh abort ("Don't run this as root!"). So pre-create the
# directory here, as root, one time, and let install.sh run unprivileged
# below: it only sudos for paths it does not already own.
- name: Pre-create the linuxbrew directory
  become: true
  ansible.builtin.file:
    path: /home/linuxbrew/.linuxbrew
    state: directory
    owner: "{{ ansible_facts['user_id'] }}"
    group: "{{ ansible_facts['user_gid'] }}"
    mode: "0755"
  when:
    - install_packages | default(true) | bool
    - ansible_facts['os_family'] != 'Darwin'
    - not homebrew_check.stat.exists

# install.sh prints a "Next steps" message telling you to add the brew
# shellenv eval to .bashrc. Ignore that: this repo does not manage .bashrc,
# and zshrc already has the Linux eval for the .zshrc it symlinks in.
- name: Install Homebrew
  ansible.builtin.shell: |
    NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: (install_packages | default(true) | bool) and not homebrew_check.stat.exists
  changed_when: true

# The install task above is skipped in check mode, so re-stat: the brew module
# tasks below must not run when brew is absent (keeps CI's dry run green).
- name: Re-check Homebrew installation
  ansible.builtin.stat:
    path: "{{ brew_bin }}"
  register: homebrew_installed
  when: install_packages | default(true) | bool

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true
  register: brew_update
  failed_when: brew_update is failed and 'Could not update' not in brew_update.msg and 'Fetching' not in brew_update.msg
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ brew_formulae }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_formulae
  until: brew_install_formulae is succeeded
  retries: 3
  delay: 5
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Upgrade Homebrew formulae
  ansible.builtin.command: "{{ brew_bin }} upgrade --formula {{ brew_formulae | join(' ') }}"
  register: brew_upgrade_formulae
  changed_when: "'Already up-to-date' not in brew_upgrade_formulae.stdout"
  failed_when: false
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_casks
  until: brew_install_casks is succeeded
  retries: 3
  delay: 5
  when:
    - install_packages | default(true) | bool
    - homebrew_installed.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: Install optional Homebrew formulae
  community.general.homebrew:
    name: "{{ optional_homebrew_formulae }}"
    state: present
    upgrade: true
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_optional_formulae
  until: brew_install_optional_formulae is succeeded
  retries: 3
  delay: 5
  when:
    - install_packages | default(true) | bool
    - install_optional | default(false) | bool
    - homebrew_installed.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: Install optional Homebrew casks
  community.general.homebrew_cask:
    name: "{{ optional_homebrew_casks }}"
    state: present
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
  register: brew_install_optional_casks
  until: brew_install_optional_casks is succeeded
  retries: 3
  delay: 5
  when:
    - install_packages | default(true) | bool
    - install_optional | default(false) | bool
    - homebrew_installed.stat.exists
    - ansible_facts['os_family'] == 'Darwin'

- name: Remove unused Homebrew dependencies (autoremove)
  ansible.builtin.command: "{{ brew_bin }} autoremove"
  register: brew_autoremove
  changed_when: brew_autoremove.stdout != ""
  when: (install_packages | default(true) | bool) and homebrew_installed.stat.exists

- name: Install Flatpak apps
  community.general.flatpak:
    name: "{{ flatpak_apps }}"
    state: present
  when:
    - install_packages | default(true) | bool
    - install_optional | default(false) | bool
    - ansible_facts['distribution'] | lower is search('steamos')

# EmuDeck: no unattended mode exists, so this downloads the AppImage and opens
# its GUI wizard once. Idempotent: skipped when the AppImage is already there.
- name: Install EmuDeck
  when:
    - install_emudeck | default(false) | bool
    - ansible_facts['distribution'] | lower is search('steamos')
  block:
    - name: Create ~/Applications
      ansible.builtin.file:
        path: "{{ ansible_facts['user_dir'] }}/Applications"
        state: directory

    - name: Get latest EmuDeck release URL
      ansible.builtin.uri:
        url: https://api.github.com/repos/EmuDeck/emudeck-electron/releases/latest
        return_content: true
      register: emudeck_release

    - name: Set EmuDeck AppImage URL
      ansible.builtin.set_fact:
        emudeck_appimage_url: "{{ emudeck_release.json.assets | selectattr('name', 'search', '\\.AppImage$') | map(attribute='browser_download_url') | first }}"

    - name: Download EmuDeck AppImage
      ansible.builtin.get_url:
        url: "{{ emudeck_appimage_url }}"
        dest: "{{ ansible_facts['user_dir'] }}/Applications/EmuDeck.AppImage"
        mode: "0755"
      register: emudeck_download

    - name: Launch EmuDeck installer
      ansible.builtin.shell: "nohup {{ ansible_facts['user_dir'] }}/Applications/EmuDeck.AppImage >/dev/null 2>&1 &"
      changed_when: false
      environment:
        DISPLAY: ":0"
      when:
        - not ansible_check_mode
        - emudeck_download is changed
